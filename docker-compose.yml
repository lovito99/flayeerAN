services:
  postgres:
    image: postgres:16-alpine
    container_name: flayer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flayer
      POSTGRES_PASSWORD: flayer
      POSTGRES_DB: flayer
    ports:
      - "5433:5432"
    volumes:
      - flayer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flayer -d flayer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flayer-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - flayer_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flayer_pgdata:
  flayer_redisdata:
